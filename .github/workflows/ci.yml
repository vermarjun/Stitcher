name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide which parts of the repo changed so each job runs only when needed.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      agent: ${{ steps.filter.outputs.agent }}
      rag: ${{ steps.filter.outputs.rag }}
      render: ${{ steps.filter.outputs.render }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            agent:
              - 'services/agent/**'
              - '.github/workflows/ci.yml'
            rag:
              - 'services/rag/**'
              - '.github/workflows/ci.yml'
            render:
              - 'services/render/**'
              - '.github/workflows/ci.yml'
            stack:
              - 'compose.yaml'
              - '.env.example'
              - 'scripts/**'
              - 'observability/**'
              - '.github/workflows/ci.yml'

  api:
    name: api (tsc, test, lint)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint

  web:
    name: web (type-check, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Build
        run: npx vite build

  agent:
    name: agent (tsc, test)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/agent/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test

  rag:
    name: rag (tsc, test)
    needs: changes
    if: needs.changes.outputs.rag == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/rag/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test

  render-unit:
    name: render (ruff, unit tests)
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/render/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Unit tests
        env:
          RENDER_API_KEY: test-key-at-least-sixteen-chars
          SANDBOX_ENABLED: "false"
        run: pytest -m "not contract and not security" -q

  render-contract:
    name: render (contract tests)
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev \
            texlive-latex-base texlive-fonts-recommended dvisvgm
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Contract tests
        env:
          RENDER_API_KEY: test-key-at-least-sixteen-chars
          SANDBOX_ENABLED: "false"
        run: pytest -m contract -q

  render-security:
    name: render (sandbox escape battery)
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/render
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t render:ci .
      # The image does not contain the tests, so the repo is mounted into it.
      - name: Run the battery inside the container
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            --security-opt seccomp=unconfined --security-opt systempaths=unconfined \
            -e RENDER_API_KEY=test-key-at-least-sixteen-chars \
            -e SANDBOX_ENABLED=true \
            -v "$PWD":/repo -w /repo \
            render:ci \
            sh -c "pip install -q --target /tmp/pt pytest pytest-asyncio && PYTHONPATH=/tmp/pt python -m pytest tests/security -m security -q"

  stack:
    name: stack (setup.sh, compose config)
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/setup.sh
      - name: setup.sh writes a usable .env
        run: |
          ./scripts/setup.sh --provider gemini --key ci-placeholder-key </dev/null
          test -s .env
          # A second run must leave the file alone.
          cp .env .env.first
          ./scripts/setup.sh --provider openai --key other </dev/null
          cmp .env .env.first
      - name: Compose file is valid
        run: docker compose config -q
      - name: Compose file is valid with the obs profile
        run: docker compose --profile obs config -q
      - name: Compose refuses to start without secrets
        run: |
          rm .env
          if docker compose config -q 2>/dev/null; then
            echo "compose accepted a missing .env" >&2
            exit 1
          fi
