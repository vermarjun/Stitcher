version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: stitcher_api
    env_file: .env
    environment:
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    command: >
      bash -lc "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # Use: docker-compose up --scale worker=3
    env_file: .env
    environment:
      PYTHONPATH: /app
      REDIS_URL: ${REDIS_URL}
    restart: unless-stopped