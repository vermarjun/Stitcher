# ─────────────────────────────────────────────────────────────────────────────
#  OpenTelemetry Collector — Stitcher observability fan-out
#
#  Receives OTLP (gRPC :4317, HTTP :4318) from every app service and fans out:
#    traces  → Tempo            (OTLP/gRPC)
#    metrics → Prometheus       (scraped from this collector's :8889 exporter)
#    logs    → Loki             (OTLP/HTTP to /otlp)
#
#  Contract: services export OTLP/HTTP/protobuf to http://otel-collector:4318
#  (see Plan/OBSERVABILITY.md §3). gRPC :4317 is also accepted for convenience.
# ─────────────────────────────────────────────────────────────────────────────

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  # Surface resource attrs (service.name, deployment.environment, etc.) as
  # labels/attributes downstream where exporters support it.
  resourcedetection:
    detectors: [env]
    timeout: 2s
    override: false
  memory_limiter:
    check_interval: 2s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  # ── Traces → Tempo (OTLP/gRPC) ──────────────────────────────────────────────
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # ── Metrics → Prometheus exporter ───────────────────────────────────────────
  # Prometheus scrapes this collector at :8889. OTel dot-notation metric names
  # (e.g. stitcher.pipeline.step.duration) become underscores in Prometheus
  # (stitcher_pipeline_step_duration_*). resource_to_telemetry_conversion turns
  # resource attrs (service.name → service_name) into metric labels.
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 5m
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true

  # ── Logs → Loki (native OTLP ingest, Loki 3.x) ──────────────────────────────
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Debug exporter — uncomment to see telemetry on the collector's stdout.
  # debug:
  #   verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/loki]
