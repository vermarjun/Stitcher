# ─────────────────────────────────────────────────────────────────────────────
#  Loki — Stitcher log store (single-binary, filesystem storage)
#
#  Loki 3.x exposes a native OTLP endpoint at /otlp/v1/logs; the OTel Collector
#  ships logs there via the otlphttp/loki exporter (endpoint http://loki:3100/otlp).
#  OTel resource attrs (service.name, etc.) are promoted to Loki labels per the
#  default OTLP mapping, so Grafana can filter logs by {service_name="stitcher-api"}.
#  Minimal known-good config for grafana/loki:latest.
# ─────────────────────────────────────────────────────────────────────────────

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Allow OTLP structured-metadata ingestion (Loki 3.x).
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h   # 7 days

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
