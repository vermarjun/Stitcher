# ─────────────────────────────────────────────────────────────────────────────
#  Grafana dashboard provisioning — loads JSON dashboards from disk.
#  Files live in /var/lib/grafana/dashboards (mounted from
#  observability/grafana/dashboards). Editable in the UI; changes persist to the
#  Grafana volume but the on-disk JSON is the source of truth on restart.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: 1

providers:
  - name: Stitcher
    orgId: 1
    folder: Stitcher
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
