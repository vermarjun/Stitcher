version: "3.9"

services:
  agent:
    build: .
    ports:
      - "4000:4000"
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY}
      - CHECKPOINT_REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-openai}
      - DEFAULT_MODEL_PLANNER=${DEFAULT_MODEL_PLANNER:-gpt-4o}
      - DEFAULT_MODEL_CODER=${DEFAULT_MODEL_CODER:-gpt-4o}
      - DEFAULT_MODEL_DEBUGGER=${DEFAULT_MODEL_DEBUGGER:-gpt-4o}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-false}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
