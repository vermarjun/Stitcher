[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manim-render-service"
version = "0.1.0"
description = "A stateless HTTP service that renders Manim Python code into videos."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Stitcher contributors" }
]
keywords = ["manim", "animation", "rendering", "sandbox", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "manim>=0.18,<0.20",
  # --- Native voiceover (offline) ---
  # manim-voiceover provides VoiceoverScene + the SpeechService base class that
  # stitcher_voiceover.OfflineTTS subclasses. mutagen reads mp3 durations so the
  # voiceover tracker can drive run_time. gTTS is intentionally NOT pulled in:
  # all TTS happens ONLINE in the worker; the render sandbox only reads cached mp3s.
  # manim-voiceover imports pkg_resources at import time, so on Python 3.11 (Docker)
  # we keep setuptools<81 to retain the pkg_resources shim.
  "manim-voiceover>=0.3.7,<0.4",
  "mutagen>=1.47",
  "setuptools<81",
  # --- Observability (OpenTelemetry; OTLP/HTTP -> collector :4318) ---
  # Fail-soft: if the collector is down the batch exporter drops spans/metrics.
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-requests>=0.50b0",
  "opentelemetry-instrumentation-logging>=0.50b0",
  "opentelemetry-distro>=0.50b0",
]

[project.optional-dependencies]
cloudinary = ["cloudinary>=1.36"]

dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.3",
  "mypy>=1.9",
  "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "stitcher_voiceover"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
  "vendor/**",                  # third-party plugins, patched copies; not our style
  "tests/fixtures/**",          # contains intentionally broken Python for contract tests
  "tests/security/fixtures/**", # sandbox-escape attempts
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "RUF",  # ruff rules
]
ignore = [
  "E501",  # line too long — ruff-format handles most
  "B008",  # function calls in defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "SIM"]
# Test fixtures are intentionally broken or use star imports — don't lint them.
"tests/fixtures/**/*.py" = ["ALL"]
"tests/security/fixtures/**/*.py" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "e2e: end-to-end tests that hit real storage / sandboxes (run manually)",
  "contract: HTTP-surface tests; need manim + ffmpeg installed",
  "security: sandbox escape attempt tests (require Linux + bubblewrap)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
