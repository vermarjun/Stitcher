# Local-dev compose file. Production deployments should use their own orchestrator
# (k8s, nomad, ECS) — this compose is for getting a working API on your laptop.
#
#   docker compose up --build              # local storage, no cloud SDKs
#   STORAGE=cloudinary docker compose up --build   # install the cloudinary extra
#   SLIM=1 docker compose up --build       # skip texlive-science and vedo (smaller image)
#
# bubblewrap creates namespaces and mounts a fresh /proc inside the container, so it needs
# CAP_SYS_ADMIN, the default AppArmor and seccomp profiles turned off, and Docker's masked
# /proc paths unmasked (systempaths=unconfined; without it bwrap fails with "Can't mount
# proc"). The container is NOT privileged.

services:
  render:
    build:
      context: .
      args:
        STORAGE: ${STORAGE:-}
        SLIM: ${SLIM:-0}
    image: manim-render-service:local
    container_name: manim-render-service
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
      - systempaths=unconfined
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    tmpfs:
      - /tmp:size=2g
    volumes:
      - renders:/tmp/renders
    restart: unless-stopped

volumes:
  renders:
