name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Mypy (non-blocking)
        run: mypy app || true

      - name: Pytest — unit only
        env:
          RENDER_API_KEY: test-key-at-least-sixteen-chars
          SANDBOX_ENABLED: "false"
        run: pytest -m "not contract and not security" -q

  contract:
    name: contract tests (manim + ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev \
            texlive-latex-base texlive-fonts-recommended dvisvgm

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest — contract
        env:
          RENDER_API_KEY: test-key-at-least-sixteen-chars
          SANDBOX_ENABLED: "false"
        run: pytest -m contract -q

  security:
    name: sandbox escape battery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mrs:ci .

      - name: Run security suite inside container
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            -e RENDER_API_KEY=test-key-at-least-sixteen-chars \
            -e SANDBOX_ENABLED=true \
            -v "$PWD":/repo -w /repo \
            mrs:ci \
            sh -c "pip install pytest pytest-asyncio && pytest -m security -q"
