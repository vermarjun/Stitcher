# ─────────────────────────────────────────────────────────────────────────────
#  Stitcher — external services override
#
#  This file extends docker-compose.yml to add the three external services.
#  It assumes the sibling repos are cloned at the paths below (relative to
#  this file at Stitcher_new/Stitcher/):
#
#    ../../Manim-Agent-Service/      → Desktop/Manim-Agent-Service/
#    ../../manim-render-service/     → Desktop/manim-render-service/
#    ../../ManimRAG/pipeline/        → Desktop/ManimRAG/pipeline/
#
#  Run the full stack:
#    docker compose -f docker-compose.yml -f docker-compose.services.yml up
#
#  macOS / Windows note: the render service's bubblewrap sandbox is Linux-only.
#  Set SANDBOX_ENABLED=false in .env.docker (already the default in the example)
#  when running on Docker Desktop.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Manim Agent Service ───────────────────────────────────────────────────
  agent-service:
    build:
      context: ../../Manim-Agent-Service
    ports:
      - "4000:4000"
    env_file:
      - ./API/.env.docker
    environment:
      # Point the agent at Redis Cloud for LangGraph checkpoints.
      CHECKPOINT_REDIS_URL: "redis://default:REDACTED_REDIS_PASSWORD@redis-10017.crce219.us-east-1-4.ec2.cloud.redislabs.com:10017"
      NODE_ENV: production
      # The shared env_file sets PORT=3000 for the API; override so the agent binds 4000
      PORT: "4000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # image ships curl, not wget
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Manim Render Service ──────────────────────────────────────────────────
  render-service:
    build:
      context: ../../manim-render-service
    ports:
      - "8000:8000"
    env_file:
      - ./API/.env.docker
    environment:
      # bubblewrap sandbox is Linux-only; disable on macOS / Windows Docker Desktop
      SANDBOX_ENABLED: "${SANDBOX_ENABLED:-false}"
      # pydantic expects uppercase log level; override the shared env_file value
      LOG_LEVEL: "INFO"
    # bubblewrap / user-namespaces require elevated capabilities
    privileged: true
    cap_add:
      - SYS_ADMIN
    tmpfs:
      - /tmp:size=2g
    restart: unless-stopped

  # ── ManimRAG Service ───────────────────────────────────────────────────────
  rag-service:
    build:
      context: ../../ManimRAG/pipeline
    ports:
      - "7001:7000"
    env_file:
      - ./API/.env.docker
    environment:
      # MongoDB Atlas Vector Search (cloud) — no local Qdrant needed.
      VECTOR_STORE: "mongodb_atlas"
      # The shared env_file sets PORT=3000 for the API; override so RAG binds 7000
      PORT: "7000"
    restart: unless-stopped
