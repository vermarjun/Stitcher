# ─────────────────────────────────────────────────────────────────────────────
#  Stitcher — core infrastructure + API
#
#  Usage (infra + API only — the most common dev case):
#    docker compose up
#
#  Full stack (all external services too — requires sibling repos cloned):
#    docker compose -f docker-compose.yml -f docker-compose.services.yml up
#
#  See .env.docker.example for required environment variables.
#  Copy it to .env.docker and fill in secrets before running.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - stitcher-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # noeviction is REQUIRED by BullMQ — under memory pressure Redis must reject
    # writes (backpressure) rather than silently EVICT queued job keys (which
    # would lose jobs). appendonly persists the queue across restarts. If you
    # point the API's BullMQ at this local redis (REDIS_HOST=redis in
    # API/.env.docker), this is the correct, DNS-safe configuration.
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-dev_redis_password}
        --maxmemory 512mb
        --maxmemory-policy noeviction
        --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - stitcher-redis-data:/data
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "-a"
        - "${REDIS_PASSWORD:-dev_redis_password}"
        - "ping"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── Qdrant (vector store for RAG) ────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - stitcher-qdrant-data:/qdrant/storage
    restart: unless-stopped

  # ── Stitcher API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./API
    ports:
      - "3000:3000"
      - "1455:3000"  # Codex OAuth callback — OpenAI redirects to localhost:1455/auth/callback
    env_file:
      - ./API/.env.docker
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stitcher-mongo-data:
  stitcher-redis-data:
  stitcher-qdrant-data:
